version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: satquery-ai-backend
    ports:
      - "7001:7001"
    environment:
      - PORT=7001
      - HOST=0.0.0.0
      - ENVIRONMENT=production
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - satquery-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_HTTP_BACKEND_URL=http://localhost:7001
        - VITE_WS_BACKEND_URL=ws://localhost:7001
    container_name: satquery-ai-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_HTTP_BACKEND_URL=http://localhost:7001
      - VITE_WS_BACKEND_URL=ws://localhost:7001
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - satquery-network

networks:
  satquery-network:
    driver: bridge
